<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLU Caisse — Entraînement codes produits</title>
<style>
  :root {
    --bg: #0a0e16;
    --panel: #121826;
    --panel-light: #1a2235;
    --border: #232d42;
    --lidl-blue: #0050aa;
    --lidl-blue-bright: #1e6fd6;
    --lidl-yellow: #ffd100;
    --led-orange: #ff8c1a;
    --led-orange-glow: #ffb066;
    --text: #eef1f7;
    --text-dim: #8b96ad;
    --text-faint: #5a6478;
    --success: #2ecc71;
    --error: #ff4d4d;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
  }

  body {
    background-image:
      radial-gradient(circle at 15% 0%, rgba(0,80,170,0.18), transparent 45%),
      radial-gradient(circle at 85% 100%, rgba(255,209,0,0.06), transparent 40%);
  }

  #app {
    max-width: 880px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  /* ---------- HEADER ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-mark {
    width: 38px;
    height: 38px;
    border-radius: 9px;
    background: var(--lidl-blue);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 14px;
    color: var(--lidl-yellow);
    flex-shrink: 0;
    letter-spacing: -0.5px;
    border: 2px solid var(--lidl-yellow);
  }

  .brand-text h1 {
    font-size: 16px;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.2px;
  }

  .brand-text p {
    font-size: 12px;
    color: var(--text-dim);
    margin: 1px 0 0;
  }

  .stats-pill {
    display: flex;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 14px 6px 6px;
    align-items: center;
  }

  .stats-pill .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 8px;
  }

  .stats-pill .stat-num {
    font-family: 'Courier New', monospace;
    font-weight: 700;
    font-size: 15px;
    color: var(--lidl-yellow);
  }

  .stats-pill .stat-label {
    font-size: 9px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* ---------- NAV TABS (modes) ---------- */
  .mode-nav {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 22px;
  }

  .mode-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 10px;
    color: var(--text-dim);
    cursor: pointer;
    text-align: center;
    transition: all 0.15s ease;
    font-size: 13px;
    font-weight: 600;
  }

  .mode-btn .mode-icon {
    font-size: 19px;
    display: block;
    margin-bottom: 4px;
  }

  .mode-btn:hover {
    border-color: var(--lidl-blue-bright);
    color: var(--text);
  }

  .mode-btn.active {
    background: var(--lidl-blue);
    border-color: var(--lidl-blue-bright);
    color: white;
  }

  /* ---------- CATEGORY FILTER ---------- */
  .cat-filter {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .cat-chip {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 12.5px;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s ease;
    font-weight: 600;
  }

  .cat-chip:hover { border-color: var(--lidl-blue-bright); }

  .cat-chip.active {
    background: var(--lidl-yellow);
    border-color: var(--lidl-yellow);
    color: #1a1500;
  }

  /* ---------- LEARN MODE: GRID ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
  }

  .pcard {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 10px 10px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.12s ease, border-color 0.12s ease;
    position: relative;
  }

  .pcard:hover {
    transform: translateY(-2px);
    border-color: var(--lidl-blue-bright);
  }

  .pcard .photo-wrap {
    width: 100%;
    padding-bottom: 100%;
    position: relative;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 8px;
    background: #fff;
  }

  .pcard .photo-wrap img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .pcard .pname {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 8px;
    min-height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .led-code {
    font-family: 'Courier New', monospace;
    font-weight: 700;
    font-size: 19px;
    color: var(--led-orange);
    background: #000;
    border-radius: 6px;
    padding: 4px 0;
    letter-spacing: 2px;
    text-shadow: 0 0 8px var(--led-orange-glow);
    border: 1px solid #2a1f10;
  }

  .pcard .mastery-dot {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-faint);
  }

  .mastery-dot.weak { background: var(--error); }
  .mastery-dot.ok { background: var(--lidl-yellow); }
  .mastery-dot.strong { background: var(--success); }

  /* ---------- FLASHCARD MODE ---------- */
  .flash-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 0 20px;
  }

  .flash-progress {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 14px;
    font-family: 'Courier New', monospace;
  }

  .flashcard {
    width: 100%;
    max-width: 320px;
    height: 280px;
    perspective: 1200px;
    cursor: pointer;
    margin-bottom: 18px;
  }

  .flash-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transition: transform 0.45s cubic-bezier(0.4,0.2,0.2,1);
    transform-style: preserve-3d;
  }

  .flash-inner.flipped { transform: rotateY(180deg); }

  .flash-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: var(--radius);
    background: var(--panel);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .flash-face.back { transform: rotateY(180deg); }

  .flash-face .photo-wrap-big {
    width: 160px;
    height: 160px;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 14px;
    background: #fff;
  }

  .flash-face .photo-wrap-big img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .flash-face .pname-big { font-size: 17px; font-weight: 700; margin-bottom: 4px; text-align: center; }
  .flash-face .cat-tag { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 18px; }
  .flash-face .hint { font-size: 12px; color: var(--text-faint); }

  .flash-face.back .led-code { font-size: 38px; padding: 10px 24px; letter-spacing: 4px; }

  .flash-controls {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 320px;
  }

  .fbtn {
    flex: 1;
    padding: 13px 0;
    border-radius: var(--radius);
    border: none;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  .fbtn:hover { opacity: 0.85; }
  .fbtn:active { transform: scale(0.97); }

  .fbtn.miss { background: rgba(255,77,77,0.15); color: var(--error); border: 1px solid rgba(255,77,77,0.3); }
  .fbtn.hit { background: rgba(46,204,113,0.15); color: var(--success); border: 1px solid rgba(46,204,113,0.3); }

  /* ---------- QUIZ / SAISIE MODE ---------- */
  .quiz-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 0 10px;
  }

  .quiz-card {
    width: 100%;
    max-width: 360px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 24px;
    text-align: center;
    margin-bottom: 20px;
  }

  .quiz-card .photo-wrap-big {
    width: 140px;
    height: 140px;
    border-radius: 12px;
    overflow: hidden;
    margin: 0 auto 12px;
    background: #fff;
  }

  .quiz-card .photo-wrap-big img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .quiz-card .pname-big { font-size: 19px; font-weight: 700; margin-bottom: 2px; }
  .quiz-card .cat-tag { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.5px; }

  .caisse-display {
    width: 100%;
    max-width: 360px;
    background: #000;
    border: 2px solid #2a1f10;
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 18px;
    text-align: right;
    min-height: 56px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
  }

  .caisse-display .digits {
    font-family: 'Courier New', monospace;
    font-size: 34px;
    font-weight: 700;
    color: var(--led-orange);
    text-shadow: 0 0 10px var(--led-orange-glow);
    letter-spacing: 3px;
    min-height: 40px;
  }

  .caisse-display .digits.placeholder { color: #3a2c14; }

  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    width: 100%;
    max-width: 360px;
    margin-bottom: 16px;
  }

  .key {
    background: var(--panel-light);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 0;
    font-size: 19px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    font-family: 'Courier New', monospace;
    transition: background 0.1s ease;
  }

  .key:hover { background: #232f48; }
  .key:active { background: var(--lidl-blue); }

  .key.action {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 13px;
    font-family: inherit;
  }

  .key.validate {
    background: var(--lidl-yellow);
    color: #1a1500;
    border-color: var(--lidl-yellow);
  }
  .key.validate:hover { background: #ffdc33; }

  .feedback {
    width: 100%;
    max-width: 360px;
    text-align: center;
    padding: 12px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 14px;
    display: none;
  }

  .feedback.show { display: block; }
  .feedback.correct { background: rgba(46,204,113,0.12); color: var(--success); border: 1px solid rgba(46,204,113,0.3); }
  .feedback.wrong { background: rgba(255,77,77,0.12); color: var(--error); border: 1px solid rgba(255,77,77,0.3); }

  .quiz-progress {
    font-size: 12px;
    color: var(--text-dim);
    font-family: 'Courier New', monospace;
    margin-bottom: 12px;
  }

  /* ---------- SESSION SUMMARY ---------- */
  .summary {
    text-align: center;
    padding: 40px 20px;
  }

  .summary .big-score {
    font-family: 'Courier New', monospace;
    font-size: 52px;
    font-weight: 800;
    color: var(--lidl-yellow);
    margin: 10px 0;
  }

  .summary p { color: var(--text-dim); font-size: 14px; }

  .weak-list {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin: 18px auto;
    max-width: 360px;
    text-align: left;
  }

  .weak-list .wl-title {
    font-size: 12px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    font-weight: 700;
  }

  .weak-list .wl-item {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 5px 0;
    border-bottom: 1px solid var(--border);
  }
  .weak-list .wl-item:last-child { border-bottom: none; }

  .restart-btn {
    background: var(--lidl-blue);
    color: white;
    border: none;
    border-radius: var(--radius);
    padding: 13px 28px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    margin-top: 10px;
  }
  .restart-btn:hover { background: var(--lidl-blue-bright); }

  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--text-dim);
  }

  @media (max-width: 480px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
    .pcard .emoji { font-size: 28px; }
    .key { padding: 14px 0; font-size: 17px; }
  }
</style>
</head>

<script>
window.addEventListener('error', function(e) {
  var app = document.getElementById('app');
  if (app && !app.dataset.crashed) {
    app.dataset.crashed = '1';
    app.innerHTML = '<div style="padding:40px 20px;text-align:center;color:#eef1f7;font-family:sans-serif;">' +
      '<p style="font-size:16px;font-weight:600;margin-bottom:8px;">Un problème est survenu pendant le chargement.</p>' +
      '<p style="font-size:13px;color:#8b96ad;">Essaie de fermer cette page et de la rouvrir. Si le problème persiste, vérifie que tu utilises une version récente de Safari.</p>' +
      '<p style="font-size:11px;color:#5a6478;margin-top:16px;">Détail technique : ' + (e.message || 'erreur inconnue') + '</p>' +
      '</div>';
  }
});

const STORAGE_KEY = "plu_progress_v1";

// ---------- PERSISTENCE ----------
function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  const initial = {};
  PRODUCTS.forEach(p => { initial[p.id] = { seen: 0, correct: 0, wrong: 0 }; });
  return initial;
}

function saveProgress() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.progress));
  } catch (e) {}
}

function masteryLevel(stat) {

  const ratio = stat.correct / stat.seen;
  if (stat.seen < 2) return "ok";
  if (ratio >= 0.8) return "strong";
  if (ratio >= 0.5) return "ok";
  return "weak";
}

// ---------- STATE ----------
const state = {
  mode: "learn",       // learn | flash | quiz
  category: "all",
  progress: loadProgress(),
  flash: { deck: [], index: 0, flipped: false },
  quiz: { deck: [], index: 0, input: "", finished: false, sessionResults: [] }
};

function filteredProducts() {
  if (state.category === "all") return PRODUCTS;
  return PRODUCTS.filter(p => p.category === state.category);
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function totalStats() {
  let seen = 0, correct = 0;
  Object.values(state.progress).forEach(s => { seen += s.seen; correct += s.correct; });
  const acc = seen > 0 ? Math.round((correct / seen) * 100) : 0;
  return { seen, correct, acc };
}

// ---------- RENDER ROOT ----------
function render() {
  const app = document.getElementById("app");
  const s = totalStats();

  app.innerHTML = `
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">PLU</div>
        <div class="brand-text">
          <h1>Entraînement codes PLU</h1>
          <p>Formation équipiers polyvalents</p>
        </div>
      </div>
      <div class="stats-pill">
        <div class="stat">
          <span class="stat-num">${s.seen}</span>
          <span class="stat-label">Essais</span>
        </div>
        <div class="stat">
          <span class="stat-num">${s.acc}%</span>
          <span class="stat-label">Réussite</span>
        </div>
      </div>
    </div>

    <div class="mode-nav">
      <div class="mode-btn ${state.mode === 'learn' ? 'active' : ''}" data-mode="learn">
        <span class="mode-icon">📖</span>Apprendre
      </div>
      <div class="mode-btn ${state.mode === 'flash' ? 'active' : ''}" data-mode="flash">
        <span class="mode-icon">🔄</span>Flashcards
      </div>
      <div class="mode-btn ${state.mode === 'quiz' ? 'active' : ''}" data-mode="quiz">
        <span class="mode-icon">🧾</span>Saisie caisse
      </div>
    </div>

    <div class="cat-filter">
      <div class="cat-chip ${state.category === 'all' ? 'active' : ''}" data-cat="all">Tous (${PRODUCTS.length})</div>
      ${CATEGORIES.map(c => {
        const count = PRODUCTS.filter(p => p.category === c).length;
        return `<div class="cat-chip ${state.category === c ? 'active' : ''}" data-cat="${c}">${c} (${count})</div>`;
      }).join("")}
    </div>

    <div id="mode-content"></div>
  `;

  document.querySelectorAll(".mode-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      state.mode = btn.dataset.mode;
      if (state.mode === "flash") initFlashDeck();
      if (state.mode === "quiz") initQuizDeck();
      render();
    });
  });

  document.querySelectorAll(".cat-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      state.category = chip.dataset.cat;
      if (state.mode === "flash") initFlashDeck();
      if (state.mode === "quiz") initQuizDeck();
      render();
    });
  });

  if (state.mode === "learn") renderLearn();
  else if (state.mode === "flash") renderFlash();
  else if (state.mode === "quiz") renderQuiz();
}

// ---------- LEARN MODE ----------
function renderLearn() {
  const container = document.getElementById("mode-content");
  const products = filteredProducts();

  if (products.length === 0) {
    container.innerHTML = `<div class="empty-state">Aucun produit dans cette catégorie.</div>`;
    return;
  }

  container.innerHTML = `<div class="grid">
    ${products.map(p => {
      const stat = state.progress[p.id];
      const level = masteryLevel(stat);
      return `
        <div class="pcard" data-id="${p.id}">
          <div class="mastery-dot ${level}"></div>
          <div class="photo-wrap"><img src="${IMAGES[p.id]}" alt="${p.name}" loading="lazy"></div>
          <div class="pname">${p.name}</div>
          <div class="led-code">${p.code}</div>
        </div>
      `;
    }).join("")}
  </div>`;
}

// ---------- FLASHCARD MODE ----------
function initFlashDeck() {
  state.flash.deck = shuffle(filteredProducts());
  state.flash.index = 0;
  state.flash.flipped = false;
}

function renderFlash() {
  const container = document.getElementById("mode-content");
  const deck = state.flash.deck;

  if (deck.length === 0) {
    container.innerHTML = `<div class="empty-state">Aucun produit dans cette catégorie.</div>`;
    return;
  }

  if (state.flash.index >= deck.length) {
    container.innerHTML = `
      <div class="summary">
        <p>Série terminée</p>
        <div class="big-score">${deck.length} / ${deck.length}</div>
        <p>Toutes les cartes ont été vues.</p>
        <button class="restart-btn" id="restart-flash">Recommencer une série</button>
      </div>
    `;
    document.getElementById("restart-flash").addEventListener("click", () => {
      initFlashDeck();
      render();
    });
    return;
  }

  const p = deck[state.flash.index];

  container.innerHTML = `
    <div class="flash-wrap">
      <div class="flash-progress">Carte ${state.flash.index + 1} / ${deck.length}</div>
      <div class="flashcard" id="flashcard">
        <div class="flash-inner ${state.flash.flipped ? 'flipped' : ''}">
          <div class="flash-face front">
            <div class="photo-wrap-big"><img src="${IMAGES[p.id]}" alt="${p.name}"></div>
            <div class="pname-big">${p.name}</div>
            <div class="cat-tag">${p.category}</div>
            <div class="hint">Touche pour voir le code</div>
          </div>
          <div class="flash-face back">
            <div class="led-code">${p.code}</div>
          </div>
        </div>
      </div>
      <div class="flash-controls">
        <button class="fbtn miss" id="flash-miss">✗ Je ne savais pas</button>
        <button class="fbtn hit" id="flash-hit">✓ Je savais</button>
      </div>
    </div>
  `;

  document.getElementById("flashcard").addEventListener("click", () => {
    state.flash.flipped = !state.flash.flipped;
    render();
  });

  document.getElementById("flash-hit").addEventListener("click", (e) => {
    e.stopPropagation();
    recordResult(p.id, true);
    nextFlash();
  });

  document.getElementById("flash-miss").addEventListener("click", (e) => {
    e.stopPropagation();
    recordResult(p.id, false);
    nextFlash();
  });
}

function nextFlash() {
  state.flash.index++;
  state.flash.flipped = false;
  render();
}

// ---------- QUIZ / SAISIE MODE ----------
function initQuizDeck() {
  state.quiz.deck = shuffle(filteredProducts());
  state.quiz.index = 0;
  state.quiz.input = "";
  state.quiz.finished = false;
  state.quiz.sessionResults = [];
  state.quiz.feedback = null;
}

function renderQuiz() {
  const container = document.getElementById("mode-content");
  const deck = state.quiz.deck;

  if (deck.length === 0) {
    container.innerHTML = `<div class="empty-state">Aucun produit dans cette catégorie.</div>`;
    return;
  }

  if (state.quiz.index >= deck.length) {
    const results = state.quiz.sessionResults;
    const correctCount = results.filter(r => r.correct).length;
    const weak = results.filter(r => !r.correct);

    container.innerHTML = `
      <div class="summary">
        <p>Session de saisie terminée</p>
        <div class="big-score">${correctCount} / ${deck.length}</div>
        <p>${Math.round((correctCount / deck.length) * 100)}% de réussite sur cette série</p>
        ${weak.length > 0 ? `
          <div class="weak-list">
            <div class="wl-title">À revoir en priorité</div>
            ${weak.map(w => `
              <div class="wl-item">
                <span>${w.product.emoji} ${w.product.name}</span>
                <span style="color:var(--led-orange); font-family:'Courier New',monospace;">${w.product.code}</span>
              </div>
            `).join("")}
          </div>
        ` : `<p style="color:var(--success); font-weight:700;">Tous les codes connus sur cette série 👏</p>`}
        <button class="restart-btn" id="restart-quiz">Nouvelle série</button>
      </div>
    `;
    document.getElementById("restart-quiz").addEventListener("click", () => {
      initQuizDeck();
      render();
    });
    return;
  }

  const p = deck[state.quiz.index];
  const fb = state.quiz.feedback;

  container.innerHTML = `
    <div class="quiz-wrap">
      <div class="quiz-progress">Produit ${state.quiz.index + 1} / ${deck.length}</div>
      <div class="quiz-card">
        <div class="photo-wrap-big"><img src="${IMAGES[p.id]}" alt="${p.name}"></div>
        <div class="pname-big">${p.name}</div>
        <div class="cat-tag">${p.category}</div>
      </div>
      <div class="caisse-display">
        <div class="digits ${state.quiz.input === '' ? 'placeholder' : ''}">${state.quiz.input === '' ? '— — —' : state.quiz.input}</div>
      </div>
      ${fb ? `<div class="feedback show ${fb.correct ? 'correct' : 'wrong'}">${fb.correct ? '✓ Exact !' : `✗ Le code était ${p.code}`}</div>` : ""}
      <div class="keypad">
        ${[1,2,3,4,5,6,7,8,9].map(n => `<div class="key" data-key="${n}">${n}</div>`).join("")}
        <div class="key action" data-key="clear">Effacer</div>
        <div class="key" data-key="0">0</div>
        <div class="key validate" data-key="validate">OK</div>
      </div>
    </div>
  `;

  document.querySelectorAll(".key").forEach(key => {
    key.addEventListener("click", () => handleKey(key.dataset.key, p));
  });
}

function handleKey(key, product) {
  if (state.quiz.feedback) return; // wait for next

  if (key === "clear") {
    state.quiz.input = "";
    render();
    return;
  }

  if (key === "validate") {
    if (state.quiz.input === "") return;
    const correct = state.quiz.input === product.code;
    recordResult(product.id, correct);
    state.quiz.sessionResults.push({ product, correct });
    state.quiz.feedback = { correct };
    render();
    setTimeout(() => {
      state.quiz.index++;
      state.quiz.input = "";
      state.quiz.feedback = null;
      render();
    }, 1100);
    return;
  }

  if (state.quiz.input.length < 4) {
    state.quiz.input += key;
    render();
  }
}

// ---------- PROGRESS TRACKING ----------
function recordResult(productId, correct) {
  if (!state.progress[productId]) {
    state.progress[productId] = { seen: 0, correct: 0, wrong: 0 };
  }
  state.progress[productId].seen++;
  if (correct) state.progress[productId].correct++;
  else state.progress[productId].wrong++;
  saveProgress();
}

render();
</script>
